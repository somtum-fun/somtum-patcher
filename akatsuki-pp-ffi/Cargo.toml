[package]
name = "akatsuki-pp-ffi"
version = "0.1.0"
edition = "2021"
authors = ["remeliah <anoletenu@gmail.com>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
interoptopus = "0.14.14"
# Akatsuki's fork, for the osu! Relax formula (osu_2019). Only used when mode == 0 && mods & RX.
akatsuki-pp-1-0-1 = { package = "akatsuki-pp", git = "https://github.com/osuAkatsuki/akatsuki-pp-rs", rev = "b96019f50aa7d09bcbde60016481a69df04315e4" }
# ppy's official pp algorithm (community Rust port, kept in sync with lazer/osu-performance).
# Vanilla osu!/taiko/catch/mania plays route through this so the in-game counter matches the
# website and lazer's own counter.
# Pinned to rosu-pp's `pp-update` branch: ppy's 2026 Q2 SR & PP release (osu!standard parity with
# ppy.osu.Game.Rulesets.* 2026.730.0, what TomYum and osu-queue-score-statistics use). Unreleased on
# crates.io as of 2026-10-15. Vendored in vendor/rosu-pp with one fix (see vendor/rosu-pp/SOMTUM.md);
# move to the crates.io release once it carries the update.
rosu-pp = { path = "vendor/rosu-pp", default-features = false, features = ["sync"] }

[profile.release]
# The FFI functions catch panics (lib.rs `guarded`); that needs unwinding, not abort.
panic = "unwind"

[dev-dependencies]
interoptopus_backend_csharp = "0.14.14"
interoptopus_backend_c = "0.14.13"
interoptopus_backend_cpython = "0.14.14"
